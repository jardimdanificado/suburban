<!doctype html><meta charset="utf-8"><title>Composição das fachadas</title>
<style>body{margin:0;background:#dce3df;font:14px sans-serif}#status{position:absolute;top:14px;left:18px;background:#fff;padding:12px;max-width:420px}</style>
<div id="status">Carregando fachadas…</div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import {syncCityBuildings} from '../js/city_renderer_3d.js';
import {CityHousing} from '../js/city_housing.js';
import {architectureFor} from '../js/city_culture.js';
import {buildingEntrance} from '../js/city_building_geometry.js';
import {buildingFloorDesign} from '../js/city_facade_patterns.js';
try{
 const scene=new THREE.Scene();scene.background=new THREE.Color(0xdce3df);
 scene.add(new THREE.HemisphereLight(0xffffff,0x89968b,2));
 const light=new THREE.DirectionalLight(0xffeed4,2.2);light.position.set(-10,22,15);scene.add(light);
 const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);document.body.append(renderer.domElement);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshLambertMaterial({color:0xc5cbbd}));ground.rotation.x=-Math.PI/2;ground.position.set(12,-.025,4);scene.add(ground);
 const world={width:128,height:128,map:new Uint8Array(128*128).fill(3),seed:0,revision:0,getTile:()=>3,clock:{hour:12,minute:0,day:1}};
 const city={buildingTypes:{popular_housing:{rent:120,price:120000}},currency:{price:v=>v},units:new Map(),minute:0};
 const housing=new CityHousing(city),entities=[],ids=[];
 for(const period of [2,3,4]){
  const id=Array.from({length:200},(_,i)=>i+1).find(id=>buildingFloorDesign({id},1).period===period&&architectureFor('popular_housing',id).startsWith('dutch_colonial'));
  ids.push(id);
 }
 for(const [i,id] of ids.entries()){
  const entity={id,x:3+i*8,y:4,properties:{}},b={id,type:'popular_housing',width:4,depth:3,floors:6,rotation:0,architecture:architectureFor('popular_housing',id),entity,units:[],constructionKind:'building'};
  b.door=buildingEntrance(entity.x,entity.y,b.width,b.depth);entity.properties.cityBuilding=b;
  for(let z=0;z<b.floors;z++)housing.addFloor(b,z,'treasury');entities.push(entity);
 }
 const view={scene,getSurfaceElevation:()=>0};syncCityBuildings(view,THREE,entities,world);
 const camera=new THREE.OrthographicCamera(-18,18,11,-11,.1,200);camera.position.set(33,24,38);camera.lookAt(13,5,5);
 let shaderErrors=0;renderer.debug.onShaderError=()=>shaderErrors++;
 renderer.render(scene,camera);
 document.querySelector('#status').textContent='Ciclos de 2, 3 e 4 andares · mesmos materiais · eixos fixos';
 window.facadePreview={renderer,scene,camera,view,entities,shaderErrors};document.body.dataset.ready='true';
}catch(error){document.querySelector('#status').textContent=error.stack;document.body.dataset.ready='error';}
</script>
