<!doctype html><meta charset="utf-8"><title>Areia e espuma</title>
<style>body{margin:0;background:#263c40;color:white;font:16px sans-serif}#status{position:absolute;padding:12px}</style><div id="status">Carregando</div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import {addShoreFoamShader} from '../js/water_foam.js?v=shore-surge-1';
import {TerrainTracks,createTerrainTrackUniforms,addSandDepositsToMaterial} from '../js/terrain_tracks.js?v=sand-carry-1';
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(640,360);document.body.append(renderer.domElement);
let errors=0;renderer.debug.onShaderError=()=>errors++;
const scene=new THREE.Scene();scene.background=new THREE.Color('#233f46');scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));
const camera=new THREE.OrthographicCamera(-4,4,2.25,-2.25,.1,50);camera.position.set(4,9,7);camera.lookAt(4,0,2);
const uniforms=createTerrainTrackUniforms(THREE),tracks=new TerrainTracks(THREE,uniforms);
const road=new THREE.MeshLambertMaterial({color:0x454d50});addSandDepositsToMaterial(road,uniforms);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(8,4),road);ground.rotation.x=-Math.PI/2;ground.position.set(4,0,2);scene.add(ground);
const sand=new THREE.Mesh(new THREE.PlaneGeometry(2,4),new THREE.MeshLambertMaterial({color:0xd0b984}));sand.rotation.x=-Math.PI/2;sand.position.set(1,.002,2);scene.add(sand);
const water=new THREE.Mesh(new THREE.PlaneGeometry(8,1),new THREE.MeshLambertMaterial({color:0x177b8c}));water.rotation.x=-Math.PI/2;water.position.set(4,.02,3.5);scene.add(water);
const time={value:0},foam=addShoreFoamShader(new THREE.MeshLambertMaterial({color:0xf0fff5,transparent:true,side:THREE.DoubleSide,depthWrite:false}));
foam.onBeforeCompile=((enhance)=>shader=>{shader.uniforms.uCaribbeanWaterTime=time;enhance(shader);})(foam.onBeforeCompile);
const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute([0,.04,3,0,.04,3.36,8,.04,3.36,0,.04,3,8,.04,3.36,8,.04,3],3));geometry.setAttribute('uv',new THREE.Float32BufferAttribute([0,0,0,1,8,1,0,0,8,1,8,0],2));geometry.computeVertexNormals();scene.add(new THREE.Mesh(geometry,foam));
const world={width:8,height:4,getTile(x){return x<2?3:8;}},person={id:1,x:.5,y:1.5,properties:{citizen:{}}};
for(let i=0;i<50;i++){person.x=.5+i*.1;tracks.update(renderer,world,[person],.05);}
let frames=0;function frame(){time.value+=1/60;renderer.render(scene,camera);if(++frames===4)document.querySelector('#status').textContent=`${errors} erros de shader · areia depositada na rua · espuma animada`;requestAnimationFrame(frame);}frame();
</script>
