<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Rua, calçada e veículos</title>
<style>
body{margin:0;background:#19251e;color:#f4eddb;font:13px system-ui}#view{width:100vw;height:100vh}header{position:absolute;left:16px;top:16px;z-index:2;background:#18251ee8;padding:12px;border:1px solid #71816f;max-width:400px}summary{font-size:17px;font-weight:bold;cursor:pointer}button{padding:6px;margin:5px 4px 0 0}p{margin:7px 0}#error{color:#ffbcb3;white-space:pre-wrap}
</style>
<header><details open><summary>Rua, calçada e veículos</summary><p>Calçada nivelada com a rua, anel de terra para árvore e arrimo na encosta.</p><div id="controls"></div><p id="status"></p><p id="error"></p></details></header>
<div id="view"></div>
<script type="module">
import {RCT3DRenderer} from '../../js/renderer_3d.js?v=speech-default-off-1';
import {setActiveEntities} from '../../js/engine.js';
import {terrainSurfaceElevation} from '../../js/road_terrain_geometry.js?v=sidewalk-grade-4';
import {TILE_WATER} from '../../js/world_gen.js?v=deep-perf-3';
const error=document.querySelector('#error'),status=document.querySelector('#status');
window.addEventListener('error',event=>error.textContent+=event.message+'\n');
window.addEventListener('unhandledrejection',event=>error.textContent+=String(event.reason)+'\n');
try{
  const view=document.querySelector('#view'),renderer=new RCT3DRenderer(view),width=18,height=18;
  const world={width,height,map:new Uint8Array(width*height),revision:1,clock:{hour:12,minute:0},groups:[],sidewalkTiles:new Set(),sidewalkTreeTiles:new Set(),getTile(x,y){return this.map[y*width+x];}};
  for(let x=1;x<17;x++){world.map[8*width+x]=8;for(const y of [7,9])world.sidewalkTiles.add(y*width+x);}
  for(let x=1;x<17;x++)world.map[10*width+x]=TILE_WATER;world.sidewalkTreeTiles.add(7*width+4);
  const kinds=['bicicleta','bicicleta_carga','carrinho','patinete','skate','patins'],names=['Bicicleta','Bike de carga','Carrinho','Patinete','Skate','Patins'];
  const tree={id:99,x:4.5,y:7.5,destroyed:false,properties:{name:'Coqueiro',species:'coconut_palm',tree:true,cityPlant:{visualScale:1.1},render:{color:0x548d38,size:1.1,skin:'feature_tree_full.png'}}};
  const entities=[tree,...kinds.map((good,i)=>({id:100+i,x:3+i*2.3,y:8.5,destroyed:false,properties:{name:names[i],render:{color:0xffffff},cityVehicle:{id:100+i,good,angle:Math.PI/2}}}))];
  setActiveEntities(entities);renderer.mapWidth=width;renderer.mapHeight=height;renderer.setResolutionScale(1);renderer.shadowsEnabled=false;
  const controls=document.querySelector('#controls');
  const button=(text,action)=>{const b=document.createElement('button');b.textContent=text;b.onclick=action;controls.append(b);};
  function overview(){renderer.setFreeCameraMode(false);renderer.setCamera(9,8.5,5);status.textContent='Paralelepípedos e mosaico português ao lado da rua, com seis modelos de transporte.';}
  function closeup(index){
    const e=entities[index+1],h=terrainSurfaceElevation(world,e.x,e.y),dx=.95,dz=1.2,dy=1.5;
    renderer.setFreeCameraMode(true);renderer.freeCamX=e.x+dx;renderer.freeCamY=h+.45+dy;renderer.freeCamZ=e.y+dz;renderer.fpYaw=Math.atan2(-dx,-dz);renderer.fpPitch=Math.atan2(-dy,Math.hypot(dx,dz));
    status.textContent=names[index]+' — modelo completo com cores e materiais independentes.';
  }
  button('Rua e calçadas',overview);button('Árvore e arrimo + esgoto',()=>{renderer.setFreeCameraMode(false);renderer.setCamera(13,9,5);status.textContent='Arrimo de pedra com cano de esgoto e abraçadeiras metálicas junto à água.';});names.forEach((name,i)=>button(name,()=>closeup(i)));
  button('Pedra de perto',()=>{renderer.setFreeCameraMode(true);renderer.freeCamX=11;renderer.freeCamY=3.3;renderer.freeCamZ=8.5;renderer.fpPitch=-Math.PI/2+.001;renderer.fpYaw=0;status.textContent='Granulação e normal map usam as mesmas juntas e bordas das pedras.';});
  button('Grama de perto',()=>{renderer.setFreeCameraMode(true);renderer.freeCamX=8;renderer.freeCamY=1.65;renderer.freeCamZ=11.8;renderer.fpYaw=0;renderer.fpPitch=-.25;status.textContent='Grama rasteira com lâminas finas, alturas variadas e raízes ajustadas ao solo.';});
  overview();function frame(){renderer.render(world,entities,world.clock,1/60,0);requestAnimationFrame(frame);}requestAnimationFrame(frame);
  window.addEventListener('resize',()=>renderer.resize(view.clientWidth,view.clientHeight));
}catch(cause){error.textContent=cause.stack||String(cause);}
</script>
</html>
