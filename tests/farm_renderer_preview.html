<!doctype html><meta charset="utf-8"><title>Fazendas no renderizador</title><style>body{margin:0}#view{height:100vh}pre{position:absolute;background:#fff;z-index:2;padding:8px}</style><pre id="status">Carregando…</pre><div id="view"></div>
<script type="module">
import {RCT3DRenderer} from '../js/renderer_3d.js';
import {setActiveEntities} from '../js/engine.js';
import {setup} from './helpers/city.mjs';
import {FARM_CROPS} from '../js/farm_crop_catalog.js';
try{
 const city=setup({population:12}),farm=city.buildings.find(b=>b.type==='farm'),renderer=new RCT3DRenderer(document.querySelector('#view'));let errors=0;renderer.renderer.debug.onShaderError=()=>errors++;renderer.cityDevelopment=city.development;renderer.terrainOptimizationsEnabled=false;
 city.world.map=new Uint8Array(128*128).fill(3);city.world.getTile=(x,y)=>city.world.map[y*128+x]??5;
 const entities=[farm.entity];setActiveEntities(entities);renderer.setCamera(farm.entity.x+farm.width/2,farm.entity.y+farm.depth/2,3);
 city.world.clock.day=1;city.world.clock.hour=12;city.world.clock.minute=0;
 const counts={};for(const crop of ['alface','milho','amanita','peyote','trombeta_anjo','coco','manga']){farm.crop=crop;city.economy.setupFarm(farm);for(const field of farm.fields){field.plantedAt=720-FARM_CROPS[crop].grow-1;field.establishedAt=field.plantedAt;}renderer._forceInstUpdate=true;renderer.render(city.world,entities,0,1/60,1);const visual=renderer.cityMeshes.get(farm.id)?.userData.cropPlants;counts[crop]=visual?.mesh.count||0;if(!counts[crop])throw Error(`${crop}: missing farm instances`);}
 const result={counts,shaderErrors:errors};if(errors)throw Error(JSON.stringify(result));document.querySelector('#status').textContent=JSON.stringify(result,null,2);document.body.dataset.ready='true';
}catch(e){document.querySelector('#status').textContent=e.stack;document.body.dataset.ready='error';}
</script>
