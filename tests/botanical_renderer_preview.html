<!doctype html><meta charset="utf-8"><title>Árvores no renderizador do jogo</title>
<style>body{margin:0}#view{width:100vw;height:100vh}#status{position:absolute;z-index:2;background:#fff;padding:12px;font:13px monospace;max-width:95vw;white-space:pre-wrap}</style>
<pre id="status">Carregando renderizador…</pre><div id="view"></div>
<script type="module">
import {RCT3DRenderer} from '../js/renderer_3d.js';
import {setActiveEntities} from '../js/engine.js';
import {BOTANICAL_TREE_MODELS} from '../js/botanical_trees.js?v=species-colors-3';
import {PLANT_SPECIES} from '../js/city_nature.js';
try{
 const renderer=new RCT3DRenderer(document.querySelector('#view'));
 let errors=0;renderer.renderer.debug.onShaderError=()=>errors++;
 const world={width:32,height:32,seed:42,revision:1,map:new Uint8Array(1024).fill(3),clock:{hour:12,minute:0},getTile(x,y){return x<0||y<0||x>=32||y>=32?5:this.map[y*32+x];}};
 const palette=new URLSearchParams(location.search).has('palette');
 const ids=palette?['coconut_palm','royal_palm','jeriva_palm','licuala_palm','traveller_palm','oak','mango','banana','water_lily']:[...Object.keys(BOTANICAL_TREE_MODELS),'coconut_palm','traveller_palm','water_lily'];
 const entities=ids.map((species,i)=>({id:i+1,x:palette?10+(i%4)*3.5:3+(i%7)*3.5,y:palette?11+Math.floor(i/4)*5:3+Math.floor(i/7)*3.5,properties:{species,name:PLANT_SPECIES[species]?.label||species,tree:species!=='water_lily',render:{size:1,skin:'feature_tree_full.png'},cityPlant:{form:PLANT_SPECIES[species]?.form,visualScale:1}}}));
 setActiveEntities(entities);renderer.setCamera(15,15,palette?2.2:.8);renderer.terrainOptimizationsEnabled=false;
 renderer.render(world,entities,0,1/60,1);
 const initial=[...renderer.botanicalTrees.batches.values()].reduce((n,b)=>n+b.mesh.count,0);
 renderer.render(world,entities,1/60,1/60,1);
 const retained=[...renderer.botanicalTrees.batches.values()].reduce((n,b)=>n+b.mesh.count,0);
 renderer.graphicOptions.normalMaps=false;renderer.syncActiveMaterials();renderer.render(world,entities,2/60,1/60,1);
 const rebound=[...renderer.botanicalTrees.batches.values()].every(b=>b.mesh.material===renderer.materials.botanicalTree);
 renderer.graphicOptions.normalMaps=true;renderer.syncActiveMaterials();renderer._forceInstUpdate=true;renderer.render(world,entities,3/60,1/60,1);
 const result={initial,retained,rebound,shaderErrors:errors,coconut:renderer.instPalmFronds.count,traveller:renderer.instTravellerPalms.count,waterLily:renderer.instWaterLilyPads.count,drawCalls:renderer.renderer.info.render.calls,triangles:renderer.renderer.info.render.triangles};
 if(initial!==(palette?6:41)||retained!==initial||!rebound||errors||!result.coconut||!result.traveller||!palette&&!result.waterLily)throw new Error(JSON.stringify(result));
 document.querySelector('#status').textContent=JSON.stringify(result,null,2);document.body.dataset.ready='true';
 window.botanicalRendererPreview={renderer,world,entities,result};
}catch(error){document.querySelector('#status').textContent=error.stack;document.body.dataset.ready='error';}
</script>
