<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Rastros na grama e na areia</title>
<style>body{margin:0;font:14px system-ui;background:#c2d2d7}header{position:absolute;top:10px;left:10px;background:#ffffffe8;padding:12px;border-radius:8px;max-width:520px}button{padding:8px;margin:3px}#status{display:block;padding-top:6px}</style>
<header>Esquerda: grama · Direita: areia<br>Pessoa, carrinho e bicicleta atravessam os dois terrenos.<br>
<button id="move">Percorrer trajeto</button><button id="age">Envelhecer 60 s</button><button id="reset">Reiniciar</button><button id="zoom">Aproximar</button><span id="status">Carregando…</span></header>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import {createVolumetricGrassMaterial,createVolumetricGrassMesh} from '../js/volumetric_grass.js?v=angular-canopy-ticks-1';
import {createTerrainTrackUniforms,addSandTracksToMaterial,addGrassTracksToMaterial,TerrainTracks} from '../js/terrain_tracks.js?v=contact-atlas-2';
import {mobilityModelGeometry} from '../js/city_mobility_models.js?v=ground-contacts-1';
const out=document.querySelector('#status');
try{
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);
let shaderErrors=0;renderer.debug.onShaderError=()=>{shaderErrors++;out.textContent='ERRO de shader';};
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc2d2d7);scene.add(new THREE.HemisphereLight(0xe5f1ff,0x68724e,2));const sun=new THREE.DirectionalLight(0xffefcf,2);sun.position.set(5,12,6);scene.add(sun);
const world={width:16,height:12},uniforms=createTerrainTrackUniforms(THREE),tracks=new TerrainTracks(THREE,uniforms),time={value:0};tracks.ensureWorld(renderer,world);
const surface=(x0,x1)=>{const pos=[],uv=[];for(let z=0;z<12;z++)for(let x=x0;x<x1;x++)for(const [u,v]of [[0,0],[0,1],[1,1],[0,0],[1,1],[1,0]]){pos.push(x+u,0,z+v);uv.push((x+u)/8,(z+v)/8);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.computeVertexNormals();return g;};
const grassGround=new THREE.MeshStandardMaterial({color:0x536d34,roughness:1}),grassSurface=surface(0,8);addGrassTracksToMaterial(grassGround,uniforms);scene.add(new THREE.Mesh(grassSurface,grassGround));const grass=createVolumetricGrassMesh(THREE,grassSurface,createVolumetricGrassMaterial(THREE,grassGround,time,uniforms));scene.add(grass);
const sand=new THREE.MeshStandardMaterial({color:0xd8bf83,roughness:1});addSandTracksToMaterial(sand,uniforms);scene.add(new THREE.Mesh(surface(8,16),sand));
const walker={id:1,x:1,y:3,properties:{citizen:{}}},cart={id:2,x:1,y:6,properties:{cityVehicle:{good:'carrinho',angle:Math.PI/2}}},bike={id:3,x:1,y:9,properties:{cityVehicle:{good:'bicicleta',angle:Math.PI/2}}};
const actors=[walker,cart,bike],visuals=[];
const human=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(.18,.6,.22),new THREE.MeshStandardMaterial({color:0x5269a2}));body.position.y=.55;human.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),new THREE.MeshStandardMaterial({color:0xc9956c}));head.position.y=.97;human.add(head);scene.add(human);visuals.push(human);
for(const kind of ['carrinho','bicicleta']){const model=mobilityModelGeometry(THREE,kind),g=new THREE.Group();for(const geometry of [model.fixed,model.paint])g.add(new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,side:THREE.DoubleSide})));g.rotation.y=Math.PI/2;scene.add(g);visuals.push(g);}
const motion=new WeakMap();motion.set(walker,{renderAngle:Math.PI/2});let moving=false,pausedTime=false,last=performance.now();
const camera=new THREE.OrthographicCamera(-10*innerWidth/innerHeight,10*innerWidth/innerHeight,10,-10,.1,250);camera.position.set(8,22,22);camera.lookAt(8,0,6);
const stampCount=()=>{const data=new Uint8Array(tracks.target.width*tracks.target.height*4);renderer.readRenderTargetPixels(tracks.target,0,0,tracks.target.width,tracks.target.height,data);let count=0;for(let i=3;i<data.length;i+=4)if(data[i])count++;return count;};
const report=()=>{if(!shaderErrors)out.textContent=`${moving?'Em movimento':'Parado'} · ${tracks.time.toFixed(1)} s · ${stampCount()} pixels de contato · shader OK`;};
document.querySelector('#zoom').onclick=()=>{camera.zoom=camera.zoom===1?2:1;camera.updateProjectionMatrix();};
document.querySelector('#move').onclick=()=>{tracks.clear();tracks.ensureWorld(renderer,world);moving=false;pausedTime=true;for(let step=0;step<=130;step++){for(const e of actors)e.x=1+step*.1;tracks.update(renderer,world,actors,.05,{motion},null,null);}actors.forEach((e,i)=>visuals[i].position.set(e.x,0,e.y));renderer.render(scene,camera);report();};
document.querySelector('#age').onclick=()=>{moving=false;tracks.time+=60;uniforms.terrainTrackTime.value=tracks.time;pausedTime=true;renderer.render(scene,camera);report();};
document.querySelector('#reset').onclick=()=>{tracks.clear();tracks.ensureWorld(renderer,world);for(const e of actors)e.x=1;moving=false;pausedTime=false;report();};
let frames=0;renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;if(moving){for(const e of actors)e.x=Math.min(14,e.x+dt*2);if(walker.x>=14){moving=false;pausedTime=true;}}
tracks.update(renderer,world,actors,pausedTime&&!moving?0:dt,{motion},null,null);time.value=tracks.time*60;actors.forEach((e,i)=>visuals[i].position.set(e.x,0,e.y));renderer.render(scene,camera);if(++frames%60===0)report();});report();
}catch(error){out.textContent=error.stack;}
</script></html>
